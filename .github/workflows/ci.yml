name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # Явная установка зависимостей корня и app/
      # (lifecycle-скрипт "install" удалён из package.json)
      - name: Install dependencies (root + app)
        run: |
          npm ci
          npm ci --prefix app

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (frontend + validators)
        run: npm test

      - name: Tests (API server)
        run: npm run test:server

      - name: Build
        run: npm run build
