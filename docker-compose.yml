# Локальный запуск того же образа, который собирает Render (runtime: docker).
#
# Данные лежат в именованном томе, который переживает пересборку и перезапуск
# контейнера. Сервер пишет в DATA_DIR (server/store.js) — там blocklycode.db
# (SQLite, WAL), feedback.json и JSON-фолбэки. Блок environment перекрывает .env,
# поэтому четыре переменные ниже задавать отдельно не нужно — путь тома зафиксирован
# здесь. В prod тот же путь задаёт Dockerfile, а том монтирует render.yaml.
#
#   cp .env.example .env      # затем заполнить секреты
#   docker compose up -d --build
#   curl localhost:4000/api/feedback/types
#
# Том именно именованный, а не bind-путь: bind-каталог легко потерять при переносе
# проекта, а именованный том живёт в Docker и попадает в его механизмы бэкапа.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bycode:latest
    container_name: bycode
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATA_DIR: /data
    volumes:
      - bycode-data:/data
    ports:
      - "4000:4000"

volumes:
  bycode-data:
